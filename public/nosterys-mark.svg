<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.25 2.2 50 50" role="img" aria-labelledby="nosterys-mark-title">
  <title id="nosterys-mark-title">Nosterys</title>
  <!-- App icon: the sail-and-star mark on its paper ground. It carries a
       background because a favicon sits on browser chrome we do not control.
       The viewBox is cropped to the artwork's bounding box so the mark fills
       the square instead of floating in it. nosterys-sail.svg is the frameless
       variant for in-app lockups. -->
  <rect x="7.25" y="2.2" width="50" height="50" rx="11.7" fill="#F6F3EE"/>
  <g fill="#221E19">
    <!-- mainsail: straight luff on the mast, curved leech falling to the deck -->
    <path d="M34.6 11.2c4.1 7.2 8.6 16.4 11.4 24.9H34.6Z"/>
    <!-- jib, set forward and lower -->
    <path d="M30.4 18.6V36.1h-9.1c2.4-6.1 5.5-12.3 9.1-17.5Z"/>
    <!-- hull: one swoosh, thinning to a point at the bow -->
    <path d="M12.4 39.8c12.5 3.6 27.9 3.3 39.9-2.1 1.6-.7 2.4.5 1 1.5-9.6 7.1-24.6 9.4-36.6 5.4-2.9-1-5.6-2.4-5.6-3.9 0-.7.6-1.1 1.3-.9Z"/>
  </g>
  <!-- four-point star, brass, echoing the accent-line token -->
  <path d="M47.6 9.1c.6 3.9 1.6 4.9 5.5 5.5-3.9.6-4.9 1.6-5.5 5.5-.6-3.9-1.6-4.9-5.5-5.5 3.9-.6 4.9-1.6 5.5-5.5Z" fill="#C8A24A"/>
</svg>
